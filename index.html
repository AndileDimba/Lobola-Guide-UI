<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Each page's title, description, canonical address and structured
         data. The build writes them in for every page (scripts/prerender.ts)
         and PageHead keeps them current while moving around the site. -->
    <!--page-head-->

    <!-- Icons -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#A2431F" />

    <!-- Link previews: the parts every page shares -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lobola Hub" />
    <meta property="og:image" content="https://lobola.dimba.co.za/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Lobola Hub: a family walking with gifts and a goat towards the bride's home, beside the words Zulu lobola guide." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://lobola.dimba.co.za/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
