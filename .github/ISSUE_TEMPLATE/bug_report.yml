name: Bug report
description: Something on the site is broken or behaves wrongly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. If the problem is that content is *wrong*
        rather than broken, please use the "Content correction" template instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you see?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open /guide/zulu
        2. Expand the third stage
        3. ...
    validations:
      required: true

  - type: input
    id: page
    attributes:
      label: Page
      description: Which page or URL?
      placeholder: /guide/zulu

  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Phone
        - Tablet
        - Desktop
        - Not sure
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 141 on Android

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Paste images here if the problem is visual.
